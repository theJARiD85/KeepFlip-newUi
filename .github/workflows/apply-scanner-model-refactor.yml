name: Apply scanner model refactor

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          show-progress: false

      - name: Apply refactor
        shell: bash
        run: |
          set +e
          output="$(node scripts/apply-scanner-model-refactor.mjs 2>&1)"
          status=$?
          printf '%s\n' "$output"
          exit $status

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor scanner persistence and Tripo model flow"
          git push origin HEAD:master
