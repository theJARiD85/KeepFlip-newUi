name: Apply scanner model refactor

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-scanner-model-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: node scripts/apply-scanner-model-refactor.mjs

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor scanner persistence and Tripo model flow"
          git push origin HEAD:master
