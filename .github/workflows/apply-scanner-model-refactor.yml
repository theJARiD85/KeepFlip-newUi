name: Apply scanner model refactor

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          show-progress: false

      - name: Apply refactor
        id: refactor
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/apply-scanner-model-refactor.mjs > /tmp/refactor-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/refactor-output.txt
          exit $status

      - name: Save refactor error
        if: steps.refactor.outputs.status != '0'
        run: |
          cp /tmp/refactor-output.txt REFRACTOR_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REFRACTOR_ERROR.txt
          git commit -m "Record scanner refactor failure"
          git push origin HEAD:master
          exit 1

      - name: Commit refactor
        if: steps.refactor.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor scanner persistence and Tripo model flow"
          git push origin HEAD:master
