name: Apply optimized item prompt adapter

on:
  push:
    branches: [master]
    paths:
      - "services/itemAiService.ts"
      - "services/itemAiOptimizedService.ts"
      - "scripts/apply-app-optimized-prompt.mjs"
      - ".github/workflows/apply-app-optimized-prompt.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply optimized prompt adapter
        run: node scripts/apply-app-optimized-prompt.mjs

      - name: Validate TypeScript syntax
        run: |
          npm install --no-save typescript
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of [
            'services/itemAiOptimizedService.ts',
            'services/itemAiService.ts',
            'services/item-analysis-service.ts',
          ]) {
            const result = ts.transpileModule(fs.readFileSync(file, 'utf8'), {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
              },
              reportDiagnostics: true,
              fileName: file,
            });
            const errors = (result.diagnostics || []).filter(
              (diagnostic) =>
                diagnostic.category === ts.DiagnosticCategory.Error,
            );
            if (errors.length) {
              for (const error of errors) {
                console.error(
                  ts.flattenDiagnosticMessageText(
                    error.messageText,
                    '\n',
                  ),
                );
              }
              process.exit(1);
            }
          }
          NODE

      - name: Commit generated adapter
        run: |
          if git diff --quiet -- services/item-analysis-service.ts; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "KeepFlip Automation"
          git config user.email "thejarid85@gmail.com"
          git add services/item-analysis-service.ts
          git commit -m "Map optimized prompt fields into app analysis [skip ci]"
          git push origin master
