name: Validate Appodeal native ads

on:
  push:
    branches:
      - appodeal-custom-native-ads
  pull_request:
    branches:
      - master

concurrency:
  group: appodeal-native-ads-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: appodeal-custom-native-ads
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Inventory integration
        run: node scripts/apply-appodeal-native-inventory.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run Expo lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Verify Expo module autolinking
        run: npx expo-modules-autolinking search --platform android | grep keepflip-appodeal-native

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Appodeal native module
        run: cd android && ./gradlew :keepflip-appodeal-native:compileDebugKotlin --no-daemon

      - name: Commit validated Inventory integration
        run: |
          if git diff --quiet -- 'app/(app)/inventory.tsx'; then
            echo "Inventory integration already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(app)/inventory.tsx'
          git commit -m "Insert custom native ads into Inventory"
          git push origin appodeal-custom-native-ads
