name: Add half-size scanner mesh preview

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/add-half-size-mesh-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          show-progress: false

      - name: Add centered half-size mesh preview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/scanner/scanner-screen.native.tsx')
          text = path.read_text()

          old = '''        {analysisBackdropUri ? (
          <Animated.View
            entering={FadeIn.duration(180)}
            exiting={FadeOut.duration(160)}
            pointerEvents="none"
            style={StyleSheet.absoluteFill}
          >
            {generatedModel ? (
              <MeshViewer
                jwt={generatedModel.modelJwt}
                modelUrl={generatedModel.modelUrl}
                onError={handleModelViewerError}
                projectId={generatedModel.modelProjectId}
                style={StyleSheet.absoluteFill}
              />
            ) : (
                <Image
                  cachePolicy="memory-disk"
                  contentFit="cover"
                  source={{ uri: analysisBackdropUri }}
                  style={StyleSheet.absoluteFill}
                  transition={120}
                />
            )}
          </Animated.View>
        ) : null}'''

          new = '''        {analysisBackdropUri ? (
          <Animated.View
            entering={FadeIn.duration(180)}
            exiting={FadeOut.duration(160)}
            pointerEvents="none"
            style={StyleSheet.absoluteFill}
          >
            <Image
              cachePolicy="memory-disk"
              contentFit="cover"
              source={{ uri: analysisBackdropUri }}
              style={StyleSheet.absoluteFill}
              transition={120}
            />
            <View style={styles.analysisMeshHost}>
              <MeshViewer
                jwt={generatedModel?.modelJwt ?? ""}
                modelUrl={generatedModel?.modelUrl ?? ""}
                onError={handleModelViewerError}
                projectId={generatedModel?.modelProjectId ?? ""}
                style={styles.analysisMeshViewer}
              />
            </View>
          </Animated.View>
        ) : null}'''

          if old not in text:
              raise SystemExit('Expected scanner mesh block was not found.')

          text = text.replace(old, new, 1)

          style_anchor = '''  cameraScrim: {
    position: "absolute",'''
          style_insert = '''  analysisMeshHost: {
    position: "absolute",
    top: "25%",
    right: "25%",
    bottom: "25%",
    left: "25%",
    zIndex: 12,
    overflow: "hidden",
    borderRadius: theme.radii.large,
    backgroundColor: "transparent",
  },
  analysisMeshViewer: {
    flex: 1,
    backgroundColor: "transparent",
  },
  cameraScrim: {
    position: "absolute",'''

          if style_anchor not in text:
              raise SystemExit('Expected cameraScrim style anchor was not found.')

          text = text.replace(style_anchor, style_insert, 1)
          path.write_text(text)
          PY

      - name: Verify patch markers
        run: |
          grep -F 'style={styles.analysisMeshHost}' components/scanner/scanner-screen.native.tsx
          grep -F 'top: "25%"' components/scanner/scanner-screen.native.tsx
          grep -F 'left: "25%"' components/scanner/scanner-screen.native.tsx

      - name: Commit scanner integration
        run: |
          rm -f .github/workflows/add-half-size-mesh-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show half-size rotating mesh in scanner analysis"
          git push origin HEAD:master
