name: Patch Android radar worker helpers

on:
  push:
    paths:
      - ".github/workflows/patch-radar-helper-captures.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Inline worker-only helper logic
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/scanner/value-radar.native.android.tsx")
          text = path.read_text(encoding="utf-8")

          helper_block = '''function clamp(value: number, minimum: number, maximum: number) {
            "worklet";
            return Math.min(Math.max(value, minimum), maximum);
          }

          function isRadarCategory(classId: number) {
            "worklet";

            switch (classId) {
              case 1:
              case 2:
              case 3:
              case 7:
              case 8:
              case 14:
              case 26:
              case 27:
              case 30:
              case 31:
              case 32:
              case 33:
              case 34:
              case 35:
              case 36:
              case 37:
              case 38:
              case 39:
              case 40:
              case 41:
              case 42:
              case 43:
              case 45:
              case 46:
              case 47:
              case 48:
              case 49:
              case 50:
              case 61:
              case 62:
              case 63:
              case 64:
              case 66:
              case 71:
              case 72:
              case 73:
              case 74:
              case 75:
              case 76:
              case 77:
              case 78:
              case 79:
              case 81:
              case 83:
              case 84:
              case 85:
              case 86:
              case 87:
              case 88:
              case 89:
                return true;
              default:
                return false;
            }
          }

          '''

          if helper_block not in text:
            raise RuntimeError("Expected Android radar helper block was not found")
          text = text.replace(helper_block, "", 1)

          category_condition = '''            if (
              score < MIN_DETECTION_SCORE ||
              score <= bestScore ||
              !isRadarCategory(classId)
            ) {
              continue;
            }
'''

          inline_category_condition = '''            const isAllowedCategory =
              classId === 1 ||
              classId === 2 ||
              classId === 3 ||
              classId === 7 ||
              classId === 8 ||
              classId === 14 ||
              classId === 26 ||
              classId === 27 ||
              classId === 30 ||
              classId === 31 ||
              classId === 32 ||
              classId === 33 ||
              classId === 34 ||
              classId === 35 ||
              classId === 36 ||
              classId === 37 ||
              classId === 38 ||
              classId === 39 ||
              classId === 40 ||
              classId === 41 ||
              classId === 42 ||
              classId === 43 ||
              classId === 45 ||
              classId === 46 ||
              classId === 47 ||
              classId === 48 ||
              classId === 49 ||
              classId === 50 ||
              classId === 61 ||
              classId === 62 ||
              classId === 63 ||
              classId === 64 ||
              classId === 66 ||
              classId === 71 ||
              classId === 72 ||
              classId === 73 ||
              classId === 74 ||
              classId === 75 ||
              classId === 76 ||
              classId === 77 ||
              classId === 78 ||
              classId === 79 ||
              classId === 81 ||
              classId === 83 ||
              classId === 84 ||
              classId === 85 ||
              classId === 86 ||
              classId === 87 ||
              classId === 88 ||
              classId === 89;

            if (
              score < MIN_DETECTION_SCORE ||
              score <= bestScore ||
              !isAllowedCategory
            ) {
              continue;
            }
'''

          if category_condition not in text:
            raise RuntimeError("Expected Android radar category condition was not found")
          text = text.replace(category_condition, inline_category_condition, 1)

          clamp_block = '''            const boxOffset = index * 4;
            const top = clamp(boxes[boxOffset] ?? 0, 0, 1);
            const left = clamp(boxes[boxOffset + 1] ?? 0, 0, 1);
            const bottom = clamp(boxes[boxOffset + 2] ?? 0, 0, 1);
            const right = clamp(boxes[boxOffset + 3] ?? 0, 0, 1);
            const sourceLeft = clamp(
              (cropLeft + left * cropSide) / sourceWidth,
              0,
              1,
            );
            const sourceTop = clamp(
              (cropTop + top * cropSide) / sourceHeight,
              0,
              1,
            );
            const sourceRight = clamp(
              (cropLeft + right * cropSide) / sourceWidth,
              0,
              1,
            );
            const sourceBottom = clamp(
              (cropTop + bottom * cropSide) / sourceHeight,
              0,
              1,
            );
'''

          inline_clamp_block = '''            const boxOffset = index * 4;
            const top = Math.min(Math.max(boxes[boxOffset] ?? 0, 0), 1);
            const left = Math.min(Math.max(boxes[boxOffset + 1] ?? 0, 0), 1);
            const bottom = Math.min(
              Math.max(boxes[boxOffset + 2] ?? 0, 0),
              1,
            );
            const right = Math.min(
              Math.max(boxes[boxOffset + 3] ?? 0, 0),
              1,
            );
            const sourceLeft = Math.min(
              Math.max((cropLeft + left * cropSide) / sourceWidth, 0),
              1,
            );
            const sourceTop = Math.min(
              Math.max((cropTop + top * cropSide) / sourceHeight, 0),
              1,
            );
            const sourceRight = Math.min(
              Math.max((cropLeft + right * cropSide) / sourceWidth, 0),
              1,
            );
            const sourceBottom = Math.min(
              Math.max((cropTop + bottom * cropSide) / sourceHeight, 0),
              1,
            );
'''

          if clamp_block not in text:
            raise RuntimeError("Expected Android radar clamp block was not found")
          text = text.replace(clamp_block, inline_clamp_block, 1)

          text = text.replace('          stage = "parse";', '          stage = "parse-detections";', 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit source fix and remove one-time workflow
        run: |
          git config user.name "KeepFlip Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-radar-helper-captures.yml
          git add components/scanner/value-radar.native.android.tsx
          git commit -m "Inline Android radar async worker helpers"
          git push origin HEAD:master
