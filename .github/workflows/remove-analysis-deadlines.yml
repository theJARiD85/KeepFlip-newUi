name: Remove analysis deadlines

on:
  push:
    branches: [master]
    paths:
      - "scripts/remove-analysis-deadlines.mjs"
      - ".github/workflows/remove-analysis-deadlines.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply no-deadline analysis migration
        run: node scripts/remove-analysis-deadlines.mjs

      - name: Validate generated source
        run: |
          node --check scripts/remove-analysis-deadlines.mjs
          grep -q "async: true" services/itemAiOptimizedService.ts
          grep -q "waitForItemAiExecution" services/itemAiOptimizedService.ts
          grep -q "jobToken = asString(progress.jobToken) || jobToken" services/ebaySoldCompsService.ts
          ! grep -q "MAX_WAIT_MS" services/ebaySoldCompsService.ts
          ! grep -q "return pausedMarketResearch(identification, identified);" services/item-analysis-service.ts

      - name: Commit patched application services
        run: |
          if git diff --quiet -- services/itemAiOptimizedService.ts services/ebaySoldCompsService.ts services/item-analysis-service.ts; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "KeepFlip Automation"
          git config user.email "thejarid85@gmail.com"
          git add services/itemAiOptimizedService.ts services/ebaySoldCompsService.ts services/item-analysis-service.ts
          git commit -m "Remove item analysis and sold-comps deadlines [skip ci]"
          git push origin master
