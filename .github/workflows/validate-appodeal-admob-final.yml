name: Validate Appodeal AdMob final

on:
  push:
    branches:
      - appodeal-custom-native-ads
  pull_request:
    branches:
      - master

concurrency:
  group: appodeal-admob-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: appodeal-custom-native-ads

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Validate Appodeal module and merged manifest
        id: validate_android
        continue-on-error: true
        run: |
          cd android
          ./gradlew \
            :keepflip-appodeal-native:compileDebugKotlin \
            :app:processDebugMainManifest \
            --no-daemon > ../appodeal-admob-final.txt 2>&1

      - name: Upload final Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appodeal-admob-final-output
          path: appodeal-admob-final.txt

      - name: Enforce final Android validation
        if: steps.validate_android.outcome == 'failure'
        run: |
          tail -n 260 appodeal-admob-final.txt
          exit 1
