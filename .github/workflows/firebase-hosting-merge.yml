name: Build and deploy Expo web to Firebase Hosting
on:
  push:
    branches:
      - master

permissions:
  checks: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Export Expo web app
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_APPODEAL_APP_KEY: ${{ vars.EXPO_PUBLIC_APPODEAL_APP_KEY }}
          EXPO_PUBLIC_APPODEAL_TESTING: ${{ vars.EXPO_PUBLIC_APPODEAL_TESTING }}
          EXPO_PUBLIC_APPWRITE_ANALYZE_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ANALYZE_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_ASSISTANT_ACTION_RUNS_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ASSISTANT_ACTION_RUNS_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_ASSISTANT_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ASSISTANT_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_ASSISTANT_MESSAGES_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ASSISTANT_MESSAGES_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_ASSISTANT_PREFERENCES_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ASSISTANT_PREFERENCES_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_ASSISTANT_TASKS_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ASSISTANT_TASKS_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_BOOKKEEPING_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_BOOKKEEPING_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_DATABASE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_DATABASE_ID }}
          EXPO_PUBLIC_APPWRITE_EBAY_ACCOUNT_DELETION_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_EBAY_ACCOUNT_DELETION_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_EBAY_OAUTH_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_EBAY_OAUTH_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_EBAY_OAUTH_STATES_COLLECTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_EBAY_OAUTH_STATES_COLLECTION_ID }}
          EXPO_PUBLIC_APPWRITE_EBAY_SELLER_LISTING_DEFAULTS: ${{ vars.EXPO_PUBLIC_APPWRITE_EBAY_SELLER_LISTING_DEFAULTS }}
          EXPO_PUBLIC_APPWRITE_EBAY_SOLD_COMPS_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_EBAY_SOLD_COMPS_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_ENDPOINT: ${{ vars.EXPO_PUBLIC_APPWRITE_ENDPOINT }}
          EXPO_PUBLIC_APPWRITE_GOOGLE_LENS_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_GOOGLE_LENS_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_IMAGES_BUCKET_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_IMAGES_BUCKET_ID }}
          EXPO_PUBLIC_APPWRITE_ITEM_AI_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ITEM_AI_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_ITEM_IMAGES_BUCKET_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ITEM_IMAGES_BUCKET_ID }}
          EXPO_PUBLIC_APPWRITE_ITEM_PHOTOS_COLLECTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ITEM_PHOTOS_COLLECTION_ID }}
          EXPO_PUBLIC_APPWRITE_ITEMS_COLLECTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_ITEMS_COLLECTION_ID }}
          EXPO_PUBLIC_APPWRITE_LEDGER_ENTRIES_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_LEDGER_ENTRIES_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_LISTING_GENERATOR_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_LISTING_GENERATOR_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_MARKET_COMPS_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_MARKET_COMPS_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_MARKETPLACE_INQUIRIES_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_MARKETPLACE_INQUIRIES_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_MODEL_BUCKET_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_MODEL_BUCKET_ID }}
          EXPO_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_NOTIFICATIONS_COLLECTION_ID }}
          EXPO_PUBLIC_APPWRITE_NOTIFICATIONS_DATABASE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_NOTIFICATIONS_DATABASE_ID }}
          EXPO_PUBLIC_APPWRITE_PARTS_RESEARCH_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_PARTS_RESEARCH_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_PLATFORM: ${{ vars.EXPO_PUBLIC_APPWRITE_PLATFORM }}
          EXPO_PUBLIC_APPWRITE_PROFILE_IMAGES_BUCKET_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_PROFILE_IMAGES_BUCKET_ID }}
          EXPO_PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_PROJECT_ID }}
          EXPO_PUBLIC_APPWRITE_PROJECT_NAME: ${{ vars.EXPO_PUBLIC_APPWRITE_PROJECT_NAME }}
          EXPO_PUBLIC_APPWRITE_PUSH_PROVIDER_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_PUSH_PROVIDER_ID }}
          EXPO_PUBLIC_APPWRITE_REPAIR_ASSIST_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_REPAIR_ASSIST_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_SCAN_BUCKET_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_SCAN_BUCKET_ID }}
          EXPO_PUBLIC_APPWRITE_SELLER_OPERATIONS_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_SELLER_OPERATIONS_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_SELLER_ORDERS_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_SELLER_ORDERS_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_SHELF_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_SHELF_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_SOURCING_TRIP_FINDS_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_SOURCING_TRIP_FINDS_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_SOURCING_TRIPS_TABLE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_SOURCING_TRIPS_TABLE_ID }}
          EXPO_PUBLIC_APPWRITE_SUBSCRIPTION_FUNCTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_SUBSCRIPTION_FUNCTION_ID }}
          EXPO_PUBLIC_APPWRITE_USER_PROFILES_COLLECTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_USER_PROFILES_COLLECTION_ID }}
          EXPO_PUBLIC_APPWRITE_USER_SUBSCRIPTIONS_COLLECTION_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_USER_SUBSCRIPTIONS_COLLECTION_ID }}
          EXPO_PUBLIC_EBAY_API_URL: ${{ vars.EXPO_PUBLIC_EBAY_API_URL }}
          EXPO_PUBLIC_EBAY_AUTH_URL: ${{ vars.EXPO_PUBLIC_EBAY_AUTH_URL }}
          EXPO_PUBLIC_EBAY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_EBAY_CLIENT_ID }}
          EXPO_PUBLIC_EBAY_OAUTH_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_EBAY_OAUTH_ENVIRONMENT }}
          EXPO_PUBLIC_EBAY_RUNAME: ${{ vars.EXPO_PUBLIC_EBAY_RUNAME }}
          EXPO_PUBLIC_FIREBASE_WEB_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_WEB_API_KEY }}
          EXPO_PUBLIC_FIREBASE_WEB_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_WEB_APP_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_WEB_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_WEB_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_WEB_MEASUREMENT_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_WEB_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_WEB_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_WEB_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_WEB_STORAGE_BUCKET }}
          EXPO_PUBLIC_KEEPFLIP_SUBSCRIPTIONS_ENFORCED: "true"
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_OFFERING_ID: ${{ vars.EXPO_PUBLIC_REVENUECAT_OFFERING_ID }}
          EXPO_PUBLIC_REVENUECAT_WEB_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_WEB_API_KEY }}
          EXPO_PUBLIC_TENJIN_API_KEY: ${{ vars.EXPO_PUBLIC_TENJIN_API_KEY }}

      - name: Generate sitemap and IndexNow key file
        run: node scripts/generate-sitemap.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEEPFLIP_BEA17 }}
          channelId: live
          projectId: keepflip-bea17

      - name: Ping IndexNow for changed public pages
        run: node scripts/ping-indexnow.mjs
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
