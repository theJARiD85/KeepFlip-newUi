name: Apply scanner inventory workflow

on:
  push:
    branches:
      - scanner-save-to-inventory

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-inventory-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: scanner-save-to-inventory
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply scanner and inventory migration
        run: node scripts/apply-scanner-inventory-workflow.mjs

      - name: Run Expo lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Commit migrated app code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/scanner/item-analysis-bubbles.tsx components/scanner/scanner-screen.native.tsx app/'(app)'/inventory.tsx services/inventory-service.ts
          git commit -m "Add scanner inventory save flow [scanner-inventory-applied]"
          git push origin scanner-save-to-inventory
