name: Clean on-device fast analysis branch

on:
  push:
    branches:
      - on-device-fast-analysis

concurrency:
  group: on-device-fast-analysis-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: on-device-fast-analysis
          fetch-depth: 0

      - name: Remove generated and temporary files
        run: |
          rm -rf modules/keepflip-local-vision/android/build
          rm -rf scripts/on-device-fast-analysis-parts
          rm -f scripts/on-device-fast-analysis.patch.gz.b64
          rm -f .github/workflows/apply-on-device-fast-analysis.yml

      - name: Commit clean source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove fast-analysis build artifacts and temporary tooling"
          git push origin on-device-fast-analysis
