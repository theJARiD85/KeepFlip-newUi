name: Validate scanner model refactor

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/typecheck-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/typecheck-output.txt
          exit $status

      - name: Save type-check error
        if: steps.typecheck.outputs.status != '0'
        run: |
          cp /tmp/typecheck-output.txt SCANNER_REFACTOR_TYPECHECK_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCANNER_REFACTOR_TYPECHECK_ERROR.txt
          git commit -m "Record scanner refactor type-check failure"
          git push origin HEAD:master
          exit 1

      - name: Remove validation workflow
        if: steps.typecheck.outputs.status == '0'
        run: |
          rm -f .github/workflows/validate-scanner-model-refactor.yml
          rm -f SCANNER_REFACTOR_TYPECHECK_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete scanner model refactor validation"
          git push origin HEAD:master
