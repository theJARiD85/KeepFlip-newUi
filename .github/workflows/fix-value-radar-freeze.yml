name: Fix Value Radar freeze

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-value-radar-freeze.yml

permissions:
  contents: write

jobs:
  patch-value-radar:
    if: github.event.head_commit.message == 'Apply guarded Value Radar freeze patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out KeepFlip
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Value Radar inference contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('components/scanner/value-radar.native.tsx')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''const MODEL_SIZE = 1000;
          const MAX_DETECTIONS = 500;
          const MIN_DETECTION_SCORE = 0.48;
          const FRAMES_BETWEEN_INFERENCES = 5;'''.replace('          ', ''),
                  '''const MODEL_SIZE = 320;
          const MAX_DETECTIONS = 25;
          const MIN_DETECTION_SCORE = 0.48;
          const FRAMES_BETWEEN_INFERENCES = 8;'''.replace('          ', ''),
              ),
              (
                  '''const RADAR_FRAME_RESOLUTION = {
            width: 768,
            height: 1024,
          } as const;'''.replace('          ', ''),
                  '''const RADAR_FRAME_RESOLUTION = {
            width: 640,
            height: 480,
          } as const;'''.replace('          ', ''),
              ),
              (
                  '''        const count = Math.min(
                    Math.max(Math.floor(detectedCount[0] ?? 0), 0)
                  );'''.replace('          ', ''),
                  '''        const count = Math.min(
                    Math.max(Math.floor(detectedCount[0] ?? 0), 0),
                    MAX_DETECTIONS,
                    Math.floor(boxes.length / 4),
                    classes.length,
                    scores.length,
                  );'''.replace('          ', ''),
              ),
          ]

          for old, new in replacements:
              occurrences = source.count(old)
              if occurrences != 1:
                  raise RuntimeError(
                      f'Expected exactly one guarded Value Radar block, found {occurrences}: {old!r}'
                  )
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit freeze fix
        shell: bash
        run: |
          git config user.name "KeepFlip Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/scanner/value-radar.native.tsx
          git diff --cached --check
          git commit -m "Fix Value Radar inference freeze"
          git push origin HEAD:master
