name: Align app item analysis contract

on:
  push:
    branches: [master]
    paths:
      - "services/itemAiService.ts"
      - "scripts/align-app-item-analysis-contract.mjs"
      - ".github/workflows/align-app-item-analysis-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply contract alignment
        run: node scripts/align-app-item-analysis-contract.mjs

      - name: Enforce valuation evidence gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'services/item-analysis-service.ts';
          let source = fs.readFileSync(file, 'utf8');
          const marker = '    if (identified.status !== "identified") return identified;';
          const gate = `

              if (identification.valuationReadiness === "needs_evidence") {
                return pausedMarketResearch(identification, identified);
              }`;

          if (!source.includes('return pausedMarketResearch(identification, identified);')) {
            if (!source.includes(marker)) {
              throw new Error('Could not locate the identified status gate.');
            }
            source = source.replace(marker, marker + gate);
          }

          if (!source.includes('type ItemIdentityEvidence')) {
            throw new Error('Identity-evidence types were not imported.');
          }
          if (!source.includes('identification.confidenceBreakdown')) {
            throw new Error('Per-field confidence is not being consumed.');
          }
          if (!source.includes('return pausedMarketResearch(identification, identified);')) {
            throw new Error('Valuation evidence gate was not installed.');
          }

          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Validate migration scripts
        run: |
          node --check scripts/align-app-item-analysis-contract.mjs
          grep -q "identityEvidenceForAnalysis" services/item-analysis-service.ts
          grep -q "valuationFromOldUiResult(.*" services/item-analysis-service.ts
          grep -q "VALUATION_NEEDS_EVIDENCE" services/item-analysis-service.ts

      - name: Commit aligned source
        run: |
          if git diff --quiet -- services/item-analysis-service.ts; then
            echo "No source changes were required."
            exit 0
          fi

          git config user.name "KeepFlip Automation"
          git config user.email "thejarid85@gmail.com"
          git add services/itemAiService.ts services/item-analysis-service.ts
          git commit -m "Consume item AI evidence and calibrated confidence [skip ci]"
          git push origin master
