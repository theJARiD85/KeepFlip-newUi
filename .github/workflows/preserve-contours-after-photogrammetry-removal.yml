name: Preserve contour tracing after photogrammetry removal

on:
  push:
    branches:
      - remove-photogrammetry
    paths:
      - .github/workflows/preserve-contours-after-photogrammetry-removal.yml

permissions:
  contents: write

jobs:
  patch-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-photogrammetry
          fetch-depth: 0

      - name: Preserve unrelated object-tracing changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/scanner/scanner-screen.native.tsx")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '} from "@/services/captured-object-detection.native";',
                  '} from "@/services/captured-object-detection";',
              ),
              (
                  '''        console.info("[KeepFlip captured vision] Photo trace ready.", {
          detections: result.detections.length,''',
                  '''        console.info("[KeepFlip captured vision] Photo trace ready.", {
          contours: result.contours.length,
          detections: result.detections.length,''',
              ),
              (
                  '''          {capturedObjectTrace ? (
            <KeepFlipObjectOverlay
              key={capturedObjectTrace.sourceUri}
              detections={capturedObjectTrace.detections}
              frameHeight={capturedObjectTrace.frameHeight}
              frameWidth={capturedObjectTrace.frameWidth}
              viewHeight={screenHeight}
              viewWidth={screenWidth}
            />
          ) : null}
''',
                  '',
              ),
              (
                  '''      <View pointerEvents="none" style={styles.cameraScrim} />
      {analysisState?.status === "analyzing" ? (''',
                  '''      <View pointerEvents="none" style={styles.cameraScrim} />
      {analysisBackdropUri && capturedObjectTrace ? (
        <KeepFlipObjectOverlay
          key={capturedObjectTrace.sourceUri}
          contours={capturedObjectTrace.contours}
          detections={capturedObjectTrace.detections}
          frameHeight={capturedObjectTrace.frameHeight}
          frameWidth={capturedObjectTrace.frameWidth}
          viewHeight={screenHeight}
          viewWidth={screenWidth}
        />
      ) : null}
      {analysisState?.status === "analyzing" ? (''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one scanner block, found {count}: {old[:80]!r}"
                  )
              source = source.replace(old, new, 1)

          forbidden = (
              "PhotogrammetryAPI",
              "MeshViewer",
              'tool === "3d-scan"',
              "meshViewerUrl",
              "isProcessingMesh",
          )
          leftovers = [token for token in forbidden if token in source]
          if leftovers:
              raise RuntimeError(f"Photogrammetry references remain: {leftovers}")

          path.write_text(source, encoding="utf-8")

      - name: Commit scanner correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/scanner/scanner-screen.native.tsx
          git commit -m "Preserve contour tracing after removing photogrammetry"
          git push origin HEAD:remove-photogrammetry
