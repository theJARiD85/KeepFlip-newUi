name: Deploy web to Appwrite

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appwrite-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write public Expo build environment
        env:
          EXPO_PUBLIC_BUILD_ENV: ${{ secrets.EXPO_PUBLIC_BUILD_ENV }}
        run: |
          if [ -z "$EXPO_PUBLIC_BUILD_ENV" ]; then
            echo "Missing GitHub Actions secret EXPO_PUBLIC_BUILD_ENV. Add the EXPO_PUBLIC_* values used by the web build."
            exit 1
          fi

          printf '%s\n' "$EXPO_PUBLIC_BUILD_ENV" > .env

          if grep -Ev '^[[:space:]]*(#|$|EXPO_PUBLIC_[A-Z0-9_]+=)' .env; then
            echo "EXPO_PUBLIC_BUILD_ENV may contain only EXPO_PUBLIC_* assignments, comments, or blank lines."
            exit 1
          fi

          if ! grep -q '^EXPO_PUBLIC_APPWRITE_ENDPOINT=' .env || ! grep -q '^EXPO_PUBLIC_APPWRITE_PROJECT_ID=' .env; then
            echo "EXPO_PUBLIC_BUILD_ENV must include EXPO_PUBLIC_APPWRITE_ENDPOINT and EXPO_PUBLIC_APPWRITE_PROJECT_ID."
            exit 1
          fi

      - name: Export web app
        run: npx expo export --platform web

      - name: Package prebuilt site output
        run: tar -czf code.tar.gz -C dist .

      - name: Deploy prebuilt site to Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_SITE_ID: ${{ secrets.APPWRITE_SITE_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          set -euo pipefail

          for name in APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_SITE_ID APPWRITE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

          endpoint="${APPWRITE_ENDPOINT%/}"
          deployment_url="$endpoint/sites/$APPWRITE_SITE_ID/deployments"
          auth_headers=(
            -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID"
            -H "X-Appwrite-Key: $APPWRITE_API_KEY"
          )

          created_deployment="$(curl --fail-with-body --silent --show-error \
            "${auth_headers[@]}" \
            -F 'activate=true' \
            -F 'code=@code.tar.gz;type=application/gzip' \
            "$deployment_url")"

          deployment_id="$(jq -r '."$id" // empty' <<< "$created_deployment")"
          if [ -z "$deployment_id" ]; then
            echo "Appwrite accepted no deployment ID in its response."
            exit 1
          fi

          echo "Appwrite deployment created: $deployment_id"

          for attempt in {1..180}; do
            deployment="$(curl --fail-with-body --silent --show-error \
              "${auth_headers[@]}" \
              "$deployment_url/$deployment_id")"
            status="$(jq -r '.status // empty' <<< "$deployment")"
            echo "Appwrite deployment status: ${status:-unknown}"

            case "$status" in
              active|ready)
                exit 0
                ;;
              failed)
                echo "Appwrite marked deployment $deployment_id as failed. Check its deployment logs in the Appwrite Console."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Appwrite deployment $deployment_id to finish. Check its status in the Appwrite Console."
          exit 1
