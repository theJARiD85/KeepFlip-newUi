plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.keepflip.armeasure'
version = '0.1.0'

android {
  namespace "com.keepflip.armeasure"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.ar:core:1.54.0"
  implementation "org.opencv:opencv:4.14.0"
}