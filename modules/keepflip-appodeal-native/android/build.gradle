plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.keepflipappodealnative'
version = '0.1.0'

repositories {
  google()
  mavenCentral()
  maven { url = uri('https://artifactory.appodeal.com/appodeal') }
}

android {
  namespace 'expo.modules.keepflipappodealnative'

  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '0.1.0'
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.appodeal.ads.sdk:core:4.2.0'
  // Kept by Appodeal's official React Native bridge for SDK measurement support.
  implementation 'com.appodeal.ads.sdk.adapters:iab:1.8.1.0'
}

// Paste the exact adapter dependencies generated by Appodeal's
// Configure Mediated Networks tool into this isolated file.
apply from: "${projectDir}/appodeal-networks.gradle"
